 border:1px solid var(--line);color:var(--teal);background:var(--bg);cursor:pointer;user-select:none}

<script>
const DATA=[{"n": "Bikini Watersports", "a": "Orient Bay", "r": "French", "t": "Watersports rental", "h": "Jet skis, paddleboards, kayaks and parasailing, right on Orient Beach.", "d": "Twenty years on Orient Beach, next to Bikini Beach restaurant. Jet ski (minimum age sixteen to drive, younger as a passenger), flyboard, banana boat, tubing, kayaks, paddleboards, snorkel gear and parasailing. Open daily from 9am.", "ad": "Orient Beach, Baie Orientale, 97150 Saint-Martin", "p": "", "w": "bikini-watersports.com", "m": "https://maps.google.com/?q=Bikini+Watersports+Orient+Bay+St+Martin", "o": ["water"], "res": ""}, {"n": "Colibri Massage", "a": "Orient Bay", "r": "French", "t": "Beach massage", "h": "Massage in a cabana by the sea at Coco Beach, five minutes away.", "d": "Tania and her team work from Coco Beach and KKO on Orient Bay, blending Californian, Thai, Reiki and intuitive technique. There is a private cabana by the water for couples. Bookable online.", "ad": "Coco Beach, Baie Orientale, 97150 Saint-Martin", "p": "", "w": "colibri-massage-sxm.com", "m": "https://maps.google.com/?q=Colibri+Massage+Orient+Bay+St+Martin", "o": ["wellness"], "res": ""}, {"n": "Bacchus", "a": "Hope Estate", "r": "French", "t": "Wine cellar & deli", "h": "Serious wine cellar and deli, with a very good lunch hidden behind it.", "d": "A wine cellar, delicatessen and bistronomic restaurant in one, tucked behind the Super U at Hope Estate — French and international wines, champagnes, rums, fine foods and cigars. Lunch only, until 3pm. Hard to find the first time; worth it.", "ad": "18 Rue Anegada, Hope Estate, 97150 Saint-Martin", "p": "", "w": "bacchussxm.com", "m": "https://maps.google.com/?q=Bacchus+Hope+Estate+St+Martin", "o": ["art", "indoor"], "res": ""}, {"n": "Balaou", "a": "Grand Case", "r": "French", "t": "Floating bar", "h": "A bar that floats off Grand Case — free dinghy out from the Quai 58 dock.", "d": "French Saint Martin's only floating bar, dreamed up by Johan Pidoux — the same Captain Jo — with friends Kevin and Nicolas. Floating loungers with your feet in the water, sunbeds, inflatables at no extra charge. Flyboard lessons Thursday to Sunday with Aquasports SXM, live DJs Friday and Sunday afternoons. Open daily 11am until sunset. Message them and they will send a dinghy from the wooden dock at Quai 58.", "ad": "Off Grand Case bay — dinghy from the Quai 58 dock", "p": "", "w": "", "m": "https://maps.google.com/?q=Balaou+Grand+Case+St+Martin", "o": ["water", "drinks"], "res": ""}, {"n": "Boutique COSY SXM", "a": "Hope Estate", "r": "French", "t": "Home decor", "h": "Furniture and decoration, indoor and out, at the Cul de Sac roundabout.", "d": "A décor and furniture boutique at the Cul de Sac roundabout by Hope Estate. Monday to Saturday, 9:30am–12:30pm and 2pm–6pm.", "ad": "Rond-point de Cul de Sac, Place Péninsule, Hope Estate, 97150 Saint-Martin", "p": "+590 690 54 27 80", "w": "", "m": "https://maps.google.com/?q=Boutique+COSY+SXM+Hope+Estate+St+Martin", "o": ["shops"], "res": ""}, {"n": "Captain Jo Boat Charter", "a": "Anse Marcel", "r": "French", "t": "Private boat charter", "h": "Four boats out of Anse Marcel, skippered, for a day wherever you fancy.", "d": "A small skippered charter operation out of Anse Marcel with a fleet of four — a Powercat 40, two Boston Whalers and a Kiwi 27. Day trips, island-hopping and custom itineraries.", "ad": "Anse Marcel, 97150 Saint-Martin", "p": "+590 690 37 91 73", "w": "captainjoboatcharter.com", "m": "https://maps.google.com/?q=Captain+Jo+Boat+Charter+Anse+Marcel+St+Martin", "o": ["water"], "res": ""}, {"n": "Ferry to Anguilla", "a": "Marigot", "r": "French", "t": "Ferry, about 20 min", "h": "Twenty minutes from Marigot to one of the best stretches of sand anywhere.", "d": "The public ferry leaves Marigot roughly hourly from 8:30am to 6pm, returning from Blowing Point 7:30am to 5:15pm. About twenty minutes each way. Around $30 one way, cash on board, plus a small passenger fee at the ticket office. Anguilla charges its own departure tax on the way back. Bring a passport.", "ad": "Marigot Ferry Terminal, 97150 Saint-Martin", "p": "", "w": "portdemarigot.com", "m": "https://maps.google.com/?q=Ferry+to+Anguilla+Marigot+St+Martin", "o": ["water", "daytrip"], "res": ""}, {"n": "Loterie Farm", "a": "Rambaud", "r": "French", "t": "Nature park & zipline", "h": "Jungle pool, ziplines and lunch under the trees at the foot of Pic Paradis.", "d": "A private nature reserve on the slopes below Pic Paradis: spring-water pool, ziplines, hiking trails and the Jungle Room restaurant among the trees. Zipline departures run at 10am, noon and 2pm daily — sign up at reception at least fifteen minutes before.", "ad": "Rue du Pic Paradis, 97150 Saint-Martin", "p": "+590 590 87 86 16", "w": "loteriefarm.com", "m": "https://maps.google.com/?q=Loterie+Farm+Rambaud+St+Martin", "o": ["nature", "family"], "res": ""}, {"n": "Minguet Art Gallery", "a": "Rambaud", "r": "French", "t": "Art gallery", "h": "Alexandre Minguet's landscapes, on the hill between Marigot and Grand Case.", "d": "The Minguet family gallery on Rambaud hill, showing the late Alexandre Minguet's Caribbean landscapes alongside other island artists. Originals and prints. Monday to Saturday 9am–6pm, Sunday by appointment.", "ad": "Rambaud Hill, Route de Marigot–Grand Case, 97150 Saint-Martin", "p": "+590 590 87 76 06", "w": "minguet.com", "m": "https://maps.google.com/?q=Minguet+Art+Gallery+Rambaud+St+Martin", "o": ["art"], "res": ""}, {"n": "Pharmacie Bellevue", "a": "Marigot", "r": "French", "t": "Pharmacy", "h": "The nearest full pharmacy on the French side.", "d": "A full pharmacy in the Bellevue commercial area on the edge of Marigot. Monday to Saturday 8am–7pm, closed Sunday. For out-of-hours, the island runs a duty-pharmacy rota — ask us and we will find out who is on.", "ad": "Zone d'Activité Bellevue, 97150 Marigot, Saint-Martin", "p": "+590 590 87 70 28", "w": "", "m": "https://maps.google.com/?q=Pharmacie+Bellevue+Marigot+St+Martin", "o": ["practical"], "res": ""}, {"n": "Pic Paradis", "a": "Colombier", "r": "French", "t": "Island’s highest point", "h": "424 m, the highest point on the island — both coasts from one spot.", "d": "A 2.6-mile out-and-back through mango, red gum and kapok trees to the summit at 424 m. From the top you see Marigot bay on one side and the long curve of Baie Orientale on the other. It can be steep and slippery after rain.", "ad": "Route du Pic Paradis, Colombier, 97150 Saint-Martin", "p": "", "w": "", "m": "https://maps.google.com/?q=Pic+Paradis+Colombier+St+Martin", "o": ["nature"], "res": ""}, {"n": "Rotary Lookout Point", "a": "Quartier d'Orléans", "r": "French", "t": "Viewpoint & Moses Walk", "h": "A lookout tower, and the shallow walk across to Caye Chateau beside it.", "d": "A Rotary Club lookout with interpretation panels and a wide view over the east coast. Next to it is Moses Walk, where you can wade the shallows out to the uninhabited islet of Caye Chateau. Water shoes are worth having — the bottom is rocky and there are sea urchins.", "ad": "Quartier d'Orléans, 97150 Saint-Martin", "p": "", "w": "", "m": "https://maps.google.com/?q=Rotary+Lookout+Point+Quartier+d%27Orl%C3%A9ans+St+Martin", "o": ["nature"], "res": ""}, {"n": "SXM One Island", "a": "Grand Case", "r": "French", "t": "Caps & clothing", "h": "Island caps and tees that don't look like airport souvenirs.", "d": "A homegrown SXM label — caps, clothing and accessories — on the Espérance road by Grand Case airport.", "ad": "Route de l'Espérance, Aéroport Grand Case, 97150 Saint-Martin", "p": "", "w": "sxmoneisland.com", "m": "https://maps.google.com/?q=SXM+One+Island+Grand+Case+St+Martin", "o": ["shops"], "res": ""}, {"n": "Tijon Parfumerie", "a": "Grand Case", "r": "French", "t": "Perfume workshop", "h": "Blend and bottle your own scent from 300-odd oils, then take it home.", "d": "A working perfumery on the Grand Case strip, run on the traditions of Grasse. The 90-minute class has you make three perfumes and leave with the one you like best plus a gift bag; the longer Perfume 101 runs two to three hours. Open Monday to Friday 9:30am–5pm; weekends by appointment.", "ad": "1 Rue de Petite Plage, Grand Case, 97150 Saint-Martin", "p": "+590 690 22 74 70", "w": "tijon.com", "m": "https://maps.google.com/?q=Tijon+Parfumerie+Grand+Case+St+Martin", "o": ["art", "indoor"], "res": ""}, {"n": "Ferry to St Barths", "a": "Marigot / Philipsburg", "r": "Both", "t": "Fast ferry, about 45 min", "h": "Forty-five minutes to Gustavia — go for the day, come back for dinner.", "d": "Two operators run the crossing: Voyager from Marigot and Great Bay Express from Bobby's Marina in Philipsburg. About forty-five minutes, roughly €70–110 one way. Book ahead in season and take a passport.", "ad": "Marigot Ferry Terminal or Bobby's Marina, Philipsburg", "p": "", "w": "voy12.com", "m": "https://maps.google.com/?q=Ferry+to+St+Barths+Marigot+%2F+Philipsburg+St+Martin", "o": ["water", "daytrip"], "res": ""}, {"n": "Patty Healing Hands", "a": "Comes to you", "r": "Both", "t": "Mobile massage", "h": "Twenty-four years on the island, and she comes to the villa.", "d": "Patty has been practising on SXM for twenty-four years — hot stone, acupressure, reflexology, relaxation and Reiki, plus therapeutic work on injuries and pain. She travels anywhere on the island and will come to the villa. Book at least a week ahead; she fills up.", "ad": "Mobile — comes to the villa", "p": "", "w": "", "m": "https://maps.google.com/?q=Patty+Healing+Hands+Comes+to+you+St+Martin", "o": ["wellness"], "res": ""}, {"n": "Del Mar Boutique", "a": "Simpson Bay", "r": "Dutch", "t": "Fashion boutique", "h": "Handpicked European pieces cut for the heat.", "d": "A small fashion boutique on Billy Folly Road carrying European labels chosen for the climate — light fabrics, easy shapes, for men and women.", "ad": "Billy Folly Road, Simpson Bay, Sint Maarten", "p": "", "w": "", "m": "https://maps.google.com/?q=Del+Mar+Boutique+Simpson+Bay+Sint+Maarten", "o": ["shops"], "res": ""}, {"n": "Devil’s Cupper", "a": "Point Blanche", "r": "Dutch", "t": "Hike to tide pools", "h": "A flat coastal walk to natural tide pools where the Atlantic hits the rocks.", "d": "A short, mostly flat trail along Guana Bay to the tide pools known as Devil's Cupper. The footing is tricky in places and the Atlantic side can be rough — worth shoes with grip. Access is at the end of Pelican Road.", "ad": "End of Pelican Road, Point Blanche, Sint Maarten", "p": "", "w": "", "m": "https://maps.google.com/?q=Devil%27s+Cupper+Point+Blanche+Sint+Maarten", "o": ["nature"], "res": ""}, {"n": "En Vogue", "a": "Simpson Bay", "r": "Dutch", "t": "Women’s fashion", "h": "Michaela's boutique — linen, boho-chic and small designers you won't find elsewhere.", "d": "Fifteen years and more of Michaela's eye: boho-chic, casual chic, linen dresses, handmade jewellery and bags from small designers around the world. Monday to Saturday, 9am–6pm.", "ad": "Billy Folly Road, Simpson Bay, Sint Maarten", "p": "+1 721 544 6682", "w": "", "m": "https://maps.google.com/?q=En+Vogue+Simpson+Bay+Sint+Maarten", "o": ["shops"], "res": ""}, {"n": "La Casa del Habano", "a": "Philipsburg", "r": "Dutch", "t": "Cuban cigars & lounge", "h": "The official Habanos house on Front Street, with a lounge to use it in.", "d": "An official La Casa del Habano on Wathey Square — authentic Cuban cigars, a walk-in humidor and a lounge to sit and smoke. Adults only.", "ad": "Front Street 66, Unit 1, Philipsburg, Sint Maarten", "p": "+1 721 542 2787", "w": "lcdhsxm.com", "m": "https://maps.google.com/?q=La+Casa+del+Habano+Philipsburg+Sint+Maarten", "o": ["art", "indoor"], "res": ""}, {"n": "NO1SXM", "a": "Simpson Bay", "r": "Dutch", "t": "Trimaran day sails", "h": "Two hours on a racing trimaran as the sun goes down, fourteen people maximum.", "d": "Captain Pieter has forty-five years of charter behind him, in Europe and the Caribbean. The sunset sail is two hours with cocktails and snacks, $55 a head and $39 for children, maximum fourteen aboard; the day sail runs five hours. Meet at the Nowhere Special dock in Simpson Bay — 4:30pm in winter, 5pm in summer — and a dinghy takes you out to the boat.", "ad": "Nowhere Special dock, Simpson Bay, Sint Maarten", "p": "", "w": "no1sxm.com", "m": "https://maps.google.com/?q=NO1SXM+Simpson+Bay+Sint+Maarten", "o": ["water"], "res": ""}, {"n": "Parotte Ville Bird Park", "a": "Philipsburg", "r": "Dutch", "t": "Bird sanctuary", "h": "A half-hour with the parrots, hand-feeding included — George's quiet corner of Belvedere.", "d": "A small family-run aviary and medicinal garden in Belvedere. Guided tours run about thirty minutes and include feeding ring-neck parakeets, sun conures, brown-throated conures and black-headed caiques. There is a museum on site too.", "ad": "Bishop Hill Road, Belvedere, Philipsburg, Sint Maarten", "p": "+1 721 580 8516", "w": "", "m": "https://maps.google.com/?q=Parotte+Ville+Bird+Park+Philipsburg+Sint+Maarten", "o": ["nature", "family"], "res": ""}, {"n": "Rainforest Adventures", "a": "Cul de Sac", "r": "Dutch", "t": "Zipline & sky explorer", "h": "The Flying Dutchman — the world's steepest zipline — plus the Sky Explorer chairlift.", "d": "Rockland Estate is built around Sentry Hill. The Sky Explorer chairlift carries you to the summit for the island's widest view; the Flying Dutchman then drops 2,630 feet at up to 56 mph. Gentler options include the Schooner Ride and the Emperor Valley Zip Ride.", "ad": "59 L.B. Scott Road, Philipsburg, Sint Maarten", "p": "+1 721 543 1135", "w": "rainforestadventure.com", "m": "https://maps.google.com/?q=Rainforest+Adventures+Cul+de+Sac+Sint+Maarten", "o": ["nature", "family"], "res": ""}, {"n": "Sail Renegades", "a": "Cole Bay", "r": "Dutch", "t": "Catamaran charters", "h": "All-inclusive catamaran days to Anguilla, St Barths and around.", "d": "Private catamaran charters out of Port de Plaisance, with crew, food and drink included and custom itineraries across St Martin, Anguilla and St Barths. Sunset and lunch sails run year-round.", "ad": "155 Union Road, Port de Plaisance, Slip C10, Cole Bay, Sint Maarten", "p": "", "w": "sailrenegades.com", "m": "https://maps.google.com/?q=Sail+Renegades+Cole+Bay+Sint+Maarten", "o": ["water"], "res": ""}, {"n": "Seaside Nature Park", "a": "Cay Bay", "r": "Dutch", "t": "Horseback riding", "h": "Ride out across thirty acres and finish with the horses swimming in the sea.", "d": "A thirty-acre ranch above Cay Bay with around seventy-eight horses. No riding experience needed — the tour ends with you and the horse wading into the Caribbean, which is the bit everyone remembers.", "ad": "Cay Bay Road 64, Philipsburg, Sint Maarten", "p": "+1 721 544 5255", "w": "seasidenaturepark.com", "m": "https://maps.google.com/?q=Seaside+Nature+Park+Cay+Bay+Sint+Maarten", "o": ["nature", "family"], "res": ""}, {"n": "The Art Box Gallery", "a": "Cole Bay", "r": "Dutch", "t": "Art gallery", "h": "Thirty-odd Caribbean artists under one roof, and things you can actually carry home.", "d": "Moved from Philipsburg to Cole Bay after Irma. Work from more than thirty artists, most of them Caribbean, ranging from museum-quality pieces to small handmade things worth taking back.", "ad": "89 Welfare Road, Cole Bay, Sint Maarten", "p": "+1 721 588 5999", "w": "", "m": "https://maps.google.com/?q=The+Art+Box+Gallery+Cole+Bay+Sint+Maarten", "o": ["art"], "res": ""}], OCC=[["nature", "Outdoors & nature"], ["water", "On the water"], ["drinks", "A drink somewhere different"], ["daytrip", "Day trips"], ["art", "Galleries & fine things"], ["shops", "Shopping"], ["wellness", "Massage & wellness"], ["family", "Good with kids"], ["indoor", "Rainy day"], ["practical", "Practical"]], AREA=["Orient Bay", "Cul de Sac", "Quartier d'Orléans", "Anse Marcel", "Grand Case", "Hope Estate", "Rambaud", "Colombier", "Marigot", "Cole Bay", "Simpson Bay", "Cay Bay", "Philipsburg", "Point Blanche", "Marigot / Philipsburg", "Comes to you"];
let mode='occ', filter=null;
const chips=document.getElementById('chips'), list=document.getElementById('list');
function groups(){ return mode==='occ' ? OCC.map(o=>[o[0],o[1]]) : AREA.map(a=>[a,a]); }
function inGroup(v,key){ return mode==='occ' ? v.o.includes(key) : v.a===key; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function card(v){
  const bits=[]; if(v.ad) bits.push(esc(v.ad)); if(v.p) bits.push(esc(v.p));
  const acts=['<a class="go" href="'+esc(v.m)+'" target="_blank" rel="noopener">Directions</a>'];
  if(v.p) acts.push('<a href="tel:'+v.p.replace(/[^+0-9]/g,'')+'">Call</a>');
  if(v.w) acts.push('<a href="https://'+esc(v.w.replace(/^https?:\/\//,''))+'" target="_blank" rel="noopener">Website</a>');
  acts.push('<span class="more">More</span>');
  return '<article><h3>'+esc(v.n)+'</h3><span class="pill">'+esc(v.t)+'</span>'
   +'<p class="hook">'+esc(v.h)+'</p>'
   +v.d.split('\n\n').map(t=>'<p class="desc">'+esc(t)+'</p>').join('')
   +(v.pr?'<p class="desc">'+esc(v.pr)+'</p>':'')
   +(bits.length?'<p class="meta">'+bits.join(' &middot; ')+'</p>':'')
   +'<div class="actions">'+acts.join('')+'</div></article>';
}
function render(){
  chips.innerHTML = groups().map(([k,label])=>
    '<button data-k="'+esc(k)+'" aria-pressed="'+(filter===k)+'">'+esc(label)+'</button>').join('');
  const gs = filter ? groups().filter(g=>g[0]===filter) : groups();
  let html='';
  for(const [k,label] of gs){
    const vs=DATA.filter(v=>inGroup(v,k));   // DATA is already in villa-first order
    if(!vs.length) continue;
    html += '<h2>'+esc(label)+'</h2>' + vs.map(card).join('');
  }
  list.innerHTML = html || '<p class="empty">Nothing here yet.</p>';
}
function sync(){
  document.getElementById('tab-occ').setAttribute('aria-pressed', mode==='occ');
  document.getElementById('tab-area').setAttribute('aria-pressed', mode==='area');
  render();
}
document.getElementById('tab-occ').onclick=()=>{mode='occ';filter=null;sync();};
document.getElementById('tab-area').onclick=()=>{mode='area';filter=null;sync();};
chips.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  filter = filter===b.dataset.k ? null : b.dataset.k; render(); });
list.addEventListener('click',e=>{ const m=e.target.closest('.more'); if(!m)return;
  const a=m.closest('article'); a.classList.toggle('open');
  m.textContent=a.classList.contains('open')?'Less':'More'; });
sync();
</script>

</html>
