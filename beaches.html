<script>
const DATA=[{"n": "Orient Bay", "a": "Orient Bay", "r": "French", "t": "The villa's own beach", "h": "Two kilometres of sand at the bottom of the hill, and the beach clubs along it.", "d": "The long east-facing crescent the villa looks down on, and the busiest beach on the French side. The middle is a run of beach clubs — sunbeds, lunch, a shower and a parking spot for the day — with Kontiki, Coco Beach and Bikini Beach among them. The trade wind blows onshore most of the year, so there is usually small chop and always somebody on a kayak or a paddleboard. The northern end towards the Green Cay side is quieter and free of loungers. Morning is calmest; the wind builds through the afternoon.\n\nThe far southern end, beyond the last of the clubs at the old Club Orient site, is the island's only official clothing-optional beach — everyone calls it Club O. The Perch Bar & Grill sits in the middle of that stretch. It is a distinct section with clothed beach either side of it, not something you wander into by accident.", "pr": "Walk down from the villa, or park at any of the clubs. Sunbed pairs run roughly €20–30 for the day, usually including an umbrella. For the Club O end, drive to the far southern end of the beach road, or walk south along the sand past the clubs.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Orient+Bay+Beach+Saint+Martin", "o": ["walk", "beachclub", "sunset", "clothing"], "res": ""}, {"n": "Anse Marcel", "a": "Anse Marcel", "r": "French", "t": "Sheltered resort bay", "h": "A deep, quiet bay on the north coast where the sea barely moves.", "d": "Tucked behind a headland and a marina, which makes it one of the most sheltered beaches on the island — flat water on days when Orient Bay is white. The resort takes up most of the sand and runs the loungers and the beach restaurant, but the beach itself is public like every beach in France. The road in is a long climb over the hill from Grand Case.", "pr": "About twenty minutes by car. Park by the marina and walk through.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Anse+Marcel+Beach+Saint+Martin", "o": ["calm", "beachclub"], "res": ""}, {"n": "Baie aux Prunes", "a": "Terres Basses", "r": "French", "t": "Quiet surf beach", "h": "Quiet all summer, and where the island surfs when the winter swell arrives.", "d": "A small west-facing bay on the Terres Basses with nothing built on it. In summer it is flat, clear and almost empty. From roughly December the north swell wraps in and the local surfers appear. Good snorkelling along the rocks at either end when the sea is down, and a fine spot for the sunset with a bottle.", "pr": "About thirty-five minutes by car. No facilities; park on the road above and take the steps down.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Plum+Bay+Baie+aux+Prunes+Saint+Martin", "o": ["wild", "surf", "sunset"], "res": ""}, {"n": "Baie Longue", "a": "Terres Basses", "r": "French", "t": "The island's longest beach", "h": "The island's longest beach, with nothing on it — and its best sunset.", "d": "The longest beach on St. Martin and the emptiest for its size. No beach bars, no loungers, no shade — just sand, sea and the hotel at the far eastern end. Come for the walk from one end to the other and stay for the sunset, which is the one people remember. The bottom shelves quickly in places and there can be an undertow, so swim where you can see the bottom.", "pr": "About thirty-five minutes by car. Nothing there — take water and a hat.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Baie+Longue+Beach+Terres+Basses+Saint+Martin", "o": ["wild", "sunset"], "res": ""}, {"n": "Baie Rouge", "a": "Terres Basses", "r": "French", "t": "Long open beach", "h": "Long, open and faintly pink, with a rock arch at the far end worth the walk.", "d": "One of the best-looking beaches on the island — a wide sweep of pinkish sand on the Terres Basses, facing open sea. Walk west along the sand and you reach the eroded rock arches and the little cove behind them. Because it faces the swell there is often a shore break, so it is not the one for nervous swimmers. A beach bar sits at the eastern end for chairs and a drink.", "pr": "Around thirty-five minutes by car. Dirt car park at the entrance.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Baie+Rouge+Beach+Terres+Basses+Saint+Martin", "o": ["sunset", "surf", "beachclub"], "res": ""}, {"n": "Friar's Bay", "a": "Friar's Bay", "r": "French", "t": "Family cove with beach bars", "h": "A sheltered cove with two beach bars and water calm enough to forget about.", "d": "A short, protected bay on the north-west coast, a world away from Orient Bay's wind. Two beach bars sit on the sand — good for a long lunch and a rum — and the swimming is gentle enough for children. It fills up at weekends with people from Marigot, which is part of its charm. Also the starting point for the walk over to Happy Bay.", "pr": "About twenty-five minutes by car. Free parking along the road in.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Friar's+Bay+Beach+Saint+Martin", "o": ["calm", "beachclub", "sunset"], "res": ""}, {"n": "Grand Case Beach", "a": "Grand Case", "r": "French", "t": "Village beach", "h": "Swim in front of the restaurant village, then stay for dinner and the sunset.", "d": "The strip of sand directly behind Grand Case's single street. The water is calm and the bottom is sandy, and several of the restaurants open straight onto the beach, so an afternoon swim can turn into dinner without moving the car. The sun goes down behind Anguilla from here, which is the whole point of arriving by six.", "pr": "About fifteen minutes by car. Park on the boulevard; it gets tight from seven in the evening.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Grand+Case+Beach+Saint+Martin", "o": ["calm", "sunset", "beachclub"], "res": ""}, {"n": "Happy Bay", "a": "Friar's Bay", "r": "French", "t": "Walk-in cove", "h": "Ten minutes on foot over the headland, and most days it is yours alone.", "d": "There is no road to Happy Bay. You park at Friar's Bay, take the path up the left-hand headland and drop down the other side — about ten minutes, in shoes rather than flip-flops. What you get is a curve of pale sand with palms behind it, no buildings, no loungers and usually no one. Sunset here is one of the best on the island, but do not leave the walk back until it is properly dark.\n\nClothing is optional here by custom rather than by rule — most obviously midweek, and at the quiet ends near the rocks. At weekends, when people come over from Friar's Bay, it is topless at most.", "pr": "Nothing there at all: take water. Shoes for the path.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Happy+Bay+Beach+Saint+Martin", "o": ["wild", "sunset", "clothing"], "res": ""}, {"n": "Le Galion", "a": "Quartier d'Orléans", "r": "French", "t": "Shallow reef lagoon", "h": "Waist-deep and glass-flat a long way out — the one for small children.", "d": "A reef closes off the whole bay, so the water inside is shallow, warm and almost without waves. You can wade out a very long way and still be standing. It is the calmest swimming on the island and the obvious answer for toddlers. The far end, towards Baie de l'Embouchure, catches the wind and is where the kitesurf and windsurf schools set up — worth watching even if you are not getting on a board. Trees give real shade, which Orient Bay does not.", "pr": "About ten minutes by car. Free parking on the sand track; no beach club, so bring what you need.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Le+Galion+Beach+Saint+Martin", "o": ["calm", "snorkel"], "res": ""}, {"n": "Petites Cayes", "a": "Grandes Cayes", "r": "French", "t": "Hike-in wild beach", "h": "Twenty minutes on a coastal trail to a beach with no road to it at all.", "d": "Park at Grandes Cayes and walk north on the reserve's coastal path. The trail climbs and drops over the headland and delivers you onto a small wild beach inside the nature reserve — no buildings, no shade, no one. It is the closest thing on the island to a beach you have found yourself. Go in the morning while it is cool, and take everything with you again when you leave.", "pr": "About fifteen minutes by car, then twenty on foot. Shoes, water, and no valuables in the car.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Petites+Cayes+Beach+Saint+Martin", "o": ["wild"], "res": ""}, {"n": "Tintamarre", "a": "Offshore", "r": "French", "t": "Uninhabited island", "h": "An empty island with a mud bath and turtles in the bay. Boat only.", "d": "Uninhabited, part of the nature reserve, and reachable only by boat. Most charters and the Pinel operators run there. The bay has a long pale beach, green turtles that graze the sea grass close in, and the grey clay bank people coat themselves in before rinsing off in the sea. There are no facilities of any kind — no water, no shade, nothing to buy.", "pr": "Boat only. Take water, sun cover and everything else you will want.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Tintamarre+Island+Saint+Martin", "o": ["boat", "wild", "snorkel"], "res": ""}, {"n": "Îlet Pinel", "a": "Cul de Sac", "r": "French", "t": "Island, ferry only", "h": "Five minutes on a ferry: clear shallow water, two restaurants, nothing else.", "d": "A small nature-reserve island off Cul-de-Sac, and the day trip most guests end up doing twice. The crossing takes about five minutes. The west-facing beach is sheltered and shallow, with Karibuni and Yellow Beach set back in the trees for lunch and loungers. There is no shop and no shade beyond the restaurants.\n\nA path starts behind the left-hand restaurant as you face inland and crosses the island — up, then down, five to ten minutes. The north-facing beach on the other side is quieter, rockier, has the better snorkelling of the two, and is where people swim without swimwear. Unofficially, like everywhere on the island except Club O.", "pr": "Ferries leave Cul-de-Sac through the day, roughly every half hour from mid-morning, with the last boat back in the late afternoon. Bring cash. Check the times on the day — they move with the season and the weather.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Pinel+Island+Ferry+Cul+de+Sac+Saint+Martin", "o": ["boat", "calm", "snorkel", "beachclub", "clothing"], "res": ""}, {"n": "Cupecoy Beach", "a": "Cupecoy", "r": "Dutch", "t": "Sandstone coves", "h": "Small coves under carved sandstone cliffs, and the west end's famous sunset.", "d": "Not one beach but a series of small coves tucked under soft sandstone cliffs that the sea has undercut into overhangs and caves. How much sand there is depends on the season and the last swell — sometimes generous, sometimes almost none. Steps lead down from the road. Waves and a shore break are normal here. People come for the late afternoon and stay for the sunset.\n\nIt is also the Dutch side's clothing-optional beach — unofficially, the way Happy Bay is. Which cove is busy changes with the day, and the coves are separate enough that you can pick one to suit.", "pr": "About thirty-five minutes by car. No facilities on the sand; steep steps down.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Cupecoy+Beach+Sint+Maarten", "o": ["sunset", "wild", "clothing"], "res": ""}, {"n": "Dawn Beach", "a": "Dawn Beach", "r": "Dutch", "t": "Reef beach, east coast", "h": "The sunrise side, with a reef close enough to snorkel straight off the sand.", "d": "On the east coast just over the border, facing St. Barths across the channel. A reef runs parallel to the shore a short swim out, which makes it one of the few beaches here where the snorkelling starts at your feet. The same reef means swell and some current on windy days — the water inside is fine, outside the reef it is not. Beach restaurants and loungers at the resort end.", "pr": "About twenty minutes by car. Passport not needed for the border, but keep ID in the car.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Dawn+Beach+Sint+Maarten", "o": ["snorkel", "beachclub"], "res": ""}, {"n": "Great Bay", "a": "Philipsburg", "r": "Dutch", "t": "Town beach & boardwalk", "h": "Philipsburg's own beach, with the boardwalk and the whole town behind it.", "d": "A long calm curve of sand right in front of Philipsburg, with the boardwalk — bars, restaurants, shops — running its whole length. The water is flat and the beach is wide. It is also where the cruise passengers land, so on a two-ship day it is packed and on a no-ship day it is oddly quiet. Check the cruise schedule before committing to it.", "pr": "About thirty minutes by car. Paid car parks all along the back of town.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Great+Bay+Beach+Philipsburg+Sint+Maarten", "o": ["calm", "beachclub"], "res": ""}, {"n": "Guana Bay", "a": "Guana Bay", "r": "Dutch", "t": "Wild surf beach — look, don't swim", "h": "Spectacular and empty, but not a swimming beach — come for the walk.", "d": "A long, raw east-coast beach that takes the full Atlantic swell. Local surfers use it and know it. The rip here is strong and the shore break dumps hard, and people do get into trouble — it is not a swimming beach for anyone who is not certain. As a place to walk at the end of the day, with nobody on it and the ocean doing what it likes, it is one of the best on the island.", "pr": "About twenty-five minutes by car. No lifeguard, no facilities, no phone signal in places.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Guana+Bay+Beach+Sint+Maarten", "o": ["wild", "surf"], "res": ""}, {"n": "Little Bay", "a": "Little Bay", "r": "Dutch", "t": "Sheltered bay under the fort", "h": "Sheltered swimming, a ruined fort above, and rocks that are worth a mask.", "d": "A protected bay just west of Philipsburg, calmer than Great Bay and rarely crowded. The rocky point below Fort Amsterdam holds fish and is the best snorkelling within reach of town. The path up to the fort itself takes about fifteen minutes and gives you both bays at once. Loungers and a bar at the resort end.", "pr": "About thirty minutes by car.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Little+Bay+Beach+Sint+Maarten", "o": ["calm", "snorkel"], "res": ""}, {"n": "Maho Beach", "a": "Maho Bay", "r": "Dutch", "t": "The aeroplane beach", "h": "Aircraft land over your head. Stand well back when they take off.", "d": "The small beach at the end of the Princess Juliana runway, and the island's most photographed thing. Arriving aircraft clear the road by a few metres. The Sunset Bar & Grill at the end posts the day's arrivals on a board, so you can time it. Take the departure warnings seriously: the jet blast from a large aircraft will knock an adult over and has hurt people here. The swimming is ordinary; the spectacle is not.", "pr": "About thirty-five minutes by car. Busiest in the early afternoon when the long-haul arrivals come in.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Maho+Beach+Sint+Maarten", "o": ["planes", "beachclub"], "res": ""}, {"n": "Mullet Bay", "a": "Mullet Bay", "r": "Dutch", "t": "The Dutch side's best beach", "h": "Golden sand, waves to body-surf, sunbeds and food trucks. The Dutch side's best.", "d": "Consistently rated the best beach on the Dutch side, and it earns it: a deep curve of golden sand backed by sea grape, with the old golf course behind. Waves are big enough to body-surf without being a problem, which makes it a favourite with anyone in their teens. Sunbeds, a couple of food trucks and a bar at the main entrance; walk fifty metres either way and it thins out.", "pr": "About thirty-five minutes by car. Free parking under the trees, and it fills at weekends.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Mullet+Bay+Beach+Sint+Maarten", "o": ["beachclub", "surf", "sunset"], "res": ""}, {"n": "Simpson Bay Beach", "a": "Simpson Bay", "r": "Dutch", "t": "Long strip beach", "h": "A long flat strip with the bars behind it and aircraft passing low overhead.", "d": "Two kilometres of straight sand along the Dutch side's restaurant and bar strip, so you can swim, eat and drink without moving. The western end sits under the approach to Princess Juliana — not the jet blast of Maho, just aircraft passing low overhead, which is pleasant rather than alarming. Calm water, gentle slope, and sunset straight out to sea.", "pr": "About thirty minutes by car. Park behind any of the restaurants.", "ad": "", "p": "", "w": "", "m": "https://maps.google.com/?q=Simpson+Bay+Beach+Sint+Maarten", "o": ["beachclub", "sunset", "planes"], "res": ""}], OCC=[["walk", "Walk from the villa"], ["calm", "Calm & shallow"], ["beachclub", "Sunbeds & beach bars"], ["snorkel", "Snorkelling"], ["boat", "Boat or ferry only"], ["wild", "Wild & empty"], ["surf", "Waves & surf"], ["sunset", "Sunset"], ["clothing", "Clothing optional"], ["planes", "Planes overhead"]], AREA=["Orient Bay", "Cul de Sac", "Quartier d'Orléans", "Anse Marcel", "Grandes Cayes", "Friar's Bay", "Grand Case", "Terres Basses", "Offshore", "Dawn Beach", "Guana Bay", "Philipsburg", "Little Bay", "Simpson Bay", "Maho Bay", "Mullet Bay", "Cupecoy"];
let mode='occ', filter=null;
const chips=document.getElementById('chips'), list=document.getElementById('list');
function groups(){ return mode==='occ' ? OCC.map(o=>[o[0],o[1]]) : AREA.map(a=>[a,a]); }
function inGroup(v,key){ return mode==='occ' ? v.o.includes(key) : v.a===key; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function card(v){
  const bits=[]; if(v.ad) bits.push(esc(v.ad)); if(v.p) bits.push(esc(v.p));
  const acts=['<a class="go" href="'+esc(v.m)+'" target="_blank" rel="noopener">Directions</a>'];
  if(v.p) acts.push('<a href="tel:'+v.p.replace(/[^+0-9]/g,'')+'">Call</a>');
  if(v.w) acts.push('<a href="https://'+esc(v.w.replace(/^https?:\/\//,''))+'" target="_blank" rel="noopener">Website</a>');
  acts.push('<span class="more">More</span>');
  return '<article><h3>'+esc(v.n)+'</h3><span class="pill">'+esc(v.t)+'</span>'
   +'<p class="hook">'+esc(v.h)+'</p>'
   +v.d.split('\n\n').map(t=>'<p class="desc">'+esc(t)+'</p>').join('')
   +(v.pr?'<p class="desc">'+esc(v.pr)+'</p>':'')
   +(bits.length?'<p class="meta">'+bits.join(' &middot; ')+'</p>':'')
   +'<div class="actions">'+acts.join('')+'</div></article>';
}
function render(){
  chips.innerHTML = groups().map(([k,label])=>
    '<button data-k="'+esc(k)+'" aria-pressed="'+(filter===k)+'">'+esc(label)+'</button>').join('');
  const gs = filter ? groups().filter(g=>g[0]===filter) : groups();
  let html='';
  for(const [k,label] of gs){
    const vs=DATA.filter(v=>inGroup(v,k));   // DATA is already in villa-first order
    if(!vs.length) continue;
    html += '<h2>'+esc(label)+'</h2>' + vs.map(card).join('');
  }
  list.innerHTML = html || '<p class="empty">Nothing here yet.</p>';
}
function sync(){
  document.getElementById('tab-occ').setAttribute('aria-pressed', mode==='occ');
  document.getElementById('tab-area').setAttribute('aria-pressed', mode==='area');
  render();
}
document.getElementById('tab-occ').onclick=()=>{mode='occ';filter=null;sync();};
document.getElementById('tab-area').onclick=()=>{mode='area';filter=null;sync();};
chips.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  filter = filter===b.dataset.k ? null : b.dataset.k; render(); });
list.addEventListener('click',e=>{ const m=e.target.closest('.more'); if(!m)return;
  const a=m.closest('article'); a.classList.toggle('open');
  m.textContent=a.classList.contains('open')?'Less':'More'; });
sync();
</script>

</html>
