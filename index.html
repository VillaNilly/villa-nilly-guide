<title>Villa Nilly — Dining &amp; Drinks, St. Martin / Sint Maarten</title>
<meta name="description" content="Our own picks for eating and drinking on St. Martin / Sint Maarten, from Villa Nilly.">
<meta name="theme-color" content="#39616E">
<style>
:root{--teal:#39616E;--ink:#22343B;--muted:#5d6f77;--line:#e3e8ea;--bg:#f7f8f8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 16px 12px;text-align:center}
header img{height:42px;display:block;margin:0 auto 8px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
 padding:10px 12px;display:flex;gap:8px}
.bar button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;
 font-size:14px;padding:9px 0;border-radius:10px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:var(--card);
 border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--muted);
 font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
main{padding:10px 12px 40px;max-width:720px;margin:0 auto}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
 margin:22px 2px 10px;font-weight:600}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:0 0 11px}
article h3{margin:0;font-size:17px;font-weight:600}
.type{color:var(--teal);font-size:12.5px;margin:3px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.hook{margin:0 0 8px;font-size:15px}
.desc{margin:0;font-size:14.5px;color:var(--muted);display:none}
article.open .desc{display:block}
.meta{margin-top:10px;font-size:13.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.actions a,.more{display:inline-block;font-size:13.5px;text-decoration:none;padding:8px 13px;
 border-radius:9px;border:1px solid var(--line);color:var(--teal);background:var(--bg);cursor:pointer}
.actions a.go{background:var(--teal);color:#fff;border-color:var(--teal)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:22px 16px 36px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>

<script>
const DATA=[{"n": "Ratafia", "a": "Cupecoy", "r": "Dutch", "t": "Upscale Cocktail Bar & Lounge", "h": "Premium cocktails and a sunset terrace at Porto Cupecoy.", "d": "A sophisticated cocktail lounge at Porto Cupecoy where master mixologist-owner Max crafts premium cocktails, complemented by fine wines, champagne, cigars, and caviar. The ocean-facing terrace is prime territory for sunset views. Weekly specials: Monday BOGO margaritas, Tuesday 2-for-1 tiki cocktails, Saturday DJ sets from 10pm. Open Wednesday–Saturday 5:30pm–2/3am, Tuesday/Thursday/Sunday until 1am.", "ad": "Porto Cupecoy, Cupecoy, Sint Maarten", "p": "", "w": "ratafiasxm.com", "m": "https://maps.google.com/?q=Ratafia+Cupecoy+Sint+Maarten", "o": ["drinks"], "res": ""}, {"n": "3 Amigos", "a": "Maho Bay", "r": "Dutch", "t": "Tex-Mex & Sports Bar", "h": "Tex-Mex, every game on screen, DJs after ten.", "d": "Party with Mexican food, drinks, and sports at this lively Tex-Mex spot in Maho’s premier nightlife district. Located across from Casino Royale, the second-floor restaurant serves SXM-style Tex-Mex—think lobster enchiladas, skirt steak fajitas, and tableside guacamole. Multiple TVs show every game, frozen margaritas flow freely, and after the kitchen closes at 10pm, DJs take over for dancing into the small hours. Taco Tuesday features $2 tacos all day.", "ad": "1 Rhine Road, Maho, Sint Maarten", "p": "+1 (721) 545-2563", "w": "wearesxm.com/restaurants/3-amigos", "m": "https://maps.google.com/?q=3+Amigos+Maho+Bay+Sint+Maarten", "o": ["lively"], "res": ""}, {"n": "Grumpy’s", "a": "Philipsburg", "r": "Dutch", "t": "Sports Bar & Music Venue", "h": "Laid-back sports and music bar by the Philipsburg marina.", "d": "A popular local hangout at Dock Maarten near Philipsburg’s marina area. This laid-back sports and music bar is a favorite gathering spot for both locals and visitors looking for cold drinks, good vibes, and a break from the tourist crowds. Located at the marina between the cruise port and town center, it’s perfectly positioned for a casual stop while exploring the Dutch capital.", "ad": "Dock Maarten, Philipsburg, Sint Maarten", "p": "+1 (721) 542-2167", "w": "visitstmaarten.com", "m": "https://maps.google.com/?q=Grumpy%E2%80%99s+Philipsburg+Sint+Maarten", "o": ["lively"], "res": ""}, {"n": "Sexy Beef", "a": "Philipsburg", "r": "Dutch", "t": "Caribbean BBQ / Lolo", "h": "Legendary roadside lolo — Caribbean BBQ, no ceremony.", "d": "A beloved lolo (local roadside eatery) that has achieved legendary status among visitors and locals alike. The playful name comes from the owner’s nickname given by her boyfriend. The star attraction is the satay—skewered steak, chicken, and pork smothered in velvety peanut sauce that you’ll want extra of for dipping fries and tostones. One of the few lolos with a full bar, serving what many consider the best margaritas in the Caribbean. Gets lively on weekends when locals come to party.", "ad": "Front Street 28, Philipsburg, Sint Maarten", "p": "+1 (721) 549-0200", "w": "vacationstmaarten.com/listing/sexy-beef", "m": "https://maps.google.com/?q=Sexy+Beef+Philipsburg+Sint+Maarten", "o": ["casual"], "res": ""}, {"n": "Babacool", "a": "Simpson Bay", "r": "Dutch", "t": "Beach Club & Restaurant", "h": "The only beach club on the island with a pool.", "d": "Where luxury meets barefoot freedom on Simpson Bay Beach, Babacool is the only beach club on the island with a pool. The all-white-and-pink space nestled between Karakter and Mary’s Boon has quickly become one of SXM’s hottest spots, serving refined cuisine under the direction of Michelin-starred executive chef Jérôme Ferrer—a member of Les Grandes Tables du Monde and Relais & Châteaux. Arrive by car, boat, or jet ski for crafted cocktails, ceviche, and DJ sessions that carry the energy from sunshine to sunset.", "ad": "Simpson Bay Beach, Simpson Bay, Sint Maarten", "p": "", "w": "", "m": "https://maps.google.com/?q=Babacool+Simpson+Bay+Sint+Maarten", "o": ["beach"], "res": ""}, {"n": "Bamboo House", "a": "Simpson Bay", "r": "Dutch", "t": "Award-Winning Sushi, Asian Fusion & Steakhouse with Cocktail Lounge", "h": "Sushi and steak in a restored hilltop plantation house.", "d": "For over 20 years, Bamboo House has helped define the dining scene in Sint Maarten. Perched atop Diamond Hill in a meticulously restored 19th-century sugar mill, it offers breathtaking panoramic views of Simpson Bay and spectacular sunsets. The award-winning sushi—voted best on the island for 20 consecutive years—is prepared by chefs from Nobu and Morimoto.", "ad": "150 Union Road, Cole Bay, Sint Maarten", "p": "+1 (721) 523-1508", "w": "bamboohouse-sxm.com", "m": "https://maps.google.com/?q=Bamboo+House+Simpson+Bay+Sint+Maarten", "o": ["special"], "res": "OpenTable"}, {"n": "Dinghy Dock", "a": "Simpson Bay", "r": "Dutch", "t": "Sports Bar & Sailors’ Hangout", "h": "Craft beer and cheerful chaos, beloved by sailors.", "d": "An adventurous Caribbean dive bar where nautical charm meets playful chaos. This celebrated Simpson Bay institution features a massive craft beer selection (100+ bottles plus rotating drafts—the island’s best), make-your-own drinks with bottles served tableside, and hearty bar food including their famous fish dip and stuffed shrimp poppers. The friendly staff and first-come-first-served policy create an authentically local atmosphere. Games are always on the TVs. Family-friendly by day, livelier late night.", "ad": "#46 Airport Road, Simpson Bay, Sint Maarten", "p": "+1 (721) 524-4792", "w": "opentable.com/r/dinghy-dock-sailors-bar-simpson-bay", "m": "https://maps.google.com/?q=Dinghy+Dock+Simpson+Bay+Sint+Maarten", "o": ["lively", "casual"], "res": ""}, {"n": "Lagoonies Bistro & Bar", "a": "Simpson Bay", "r": "Dutch", "t": "French Bistro & Live Music Bar", "h": "Live music on the lagoon, the sailing crowd's local.", "d": "For decades, Lagoonies has been the preferred watering hole of the sailing community, perched on the shore of Simpson Bay Lagoon at Lagoon Marina. Run by a team of women led by owner Olivia, this open-air waterfront bistro combines Claire’s traditional French cooking with a modern approach to healthy living—offering numerous vegan, vegetarian, and gluten-free options alongside Caribbean-sourced specialties. The legendary happy hour ($1.50 beers, $2 rum punches) draws a fiercely loyal local crowd, and live music fills the air multiple nights a week: folk rock Tuesdays, gypsy soul Thursdays, and Cuban salsa Fridays.", "ad": "Wellington Road 33-35, Lagoon Marina, Cole Bay, Sint Maarten", "p": "+1 (721) 523-0115", "w": "", "m": "https://maps.google.com/?q=Lagoonies+Bistro+%26+Bar+Simpson+Bay+Sint+Maarten", "o": ["lively", "casual"], "res": ""}, {"n": "Zee Best Bakeshop", "a": "Simpson Bay", "r": "Dutch", "t": "French Bakery & Deli", "h": "French bakery near the airport, going since 1983.", "d": "The takeaway outpost of Sint Maarten’s beloved Zee Best, conveniently located on Airport Road near Princess Juliana Airport. Since 1983, this family-owned institution has been a household name for French pastries baked fresh every morning—from flaky almond croissants and chocolate buns to cinnamon rolls and scones. The Bakeshop also serves gourmet sandwiches, quiches, salads, smoothies, and custom celebration cakes. A perfect pre-flight stop for provisions or a quick bite on the go.", "ad": "#100 Airport Road, Simpson Bay, Sint Maarten", "p": "+1 (721) 553-6863", "w": "zeebestrestaurant.com", "m": "https://maps.google.com/?q=Zee+Best+Bakeshop+Simpson+Bay+Sint+Maarten", "o": ["breakfast"], "res": ""}, {"n": "Calmo’s Cafe", "a": "Grand Case", "r": "French", "t": "French-Caribbean", "h": "Back on Grand Case beach after six years closed by Irma.", "d": "Reopened in 2023 after Hurricane Irma forced a six-year closure, this oceanfront institution on Grand Case beach is back. The menu blends French technique with Caribbean soul—duck confit, shrimp and scallop ravioli, lobster ravioli, and an addictive mahi tartare. Creative cocktails and a casual all-day vibe from 10am to 1am.", "ad": "Grand Case Beach, Grand Case, 97150 St. Martin", "p": "", "w": "", "m": "https://maps.google.com/?q=Calmo%E2%80%99s+Cafe+Grand+Case+St+Martin", "o": ["beach", "casual"], "res": ""}, {"n": "Captain Frenchy’s", "a": "Grand Case", "r": "French", "t": "French Beach Bar & Restaurant", "h": "Gallic beach bar on the Grand Case sand.", "d": "A veteran of the Grand Case beachfront scene with a distinctly Gallic vibe, Captain Frenchy’s combines Caribbean charm with European flair under owners Fred and François. By day, grab a lounger with waiter service and enjoy tapas, burgers, and salad niçoise with your toes in the sand. By evening, the kitchen elevates its game with refined French dinner service—think scallops in white butter sauce, frog legs, and beef tartare—all facing the lights of Anguilla. Live music, DJs, and impromptu beach parties keep things lively Thursday through Saturday.", "ad": "184 Boulevard de Grand Case, Grand Case, 97150 St. Martin", "p": "+590 690 88 44 61", "w": "", "m": "https://maps.google.com/?q=Captain+Frenchy%E2%80%99s+Grand+Case+St+Martin", "o": ["beach", "casual"], "res": ""}, {"n": "Java", "a": "Grand Case", "r": "French", "t": "Mediterranean", "h": "Mediterranean plates and cocktails, right on the beach.", "d": "An elegant beachfront restaurant and cocktail bar on the Grand Case strip, Java brings Mediterranean flavors to an idyllic Caribbean setting. The creative menu features shareable plates and refined mains—from fresh lobster and truffle pasta to slow-cooked lamb shoulder and Hemingway-style beef tenderloin flambéed tableside. The stunning wooden deck overlooking the sea is the perfect backdrop for sunset cocktails and live music evenings.", "ad": "70 Boulevard de Grand Case, Grand Case, 97150 St. Martin", "p": "+590 690 66 68 25", "w": "javasxm.com", "m": "https://maps.google.com/?q=Java+Grand+Case+St+Martin", "o": ["special", "drinks"], "res": "OpenTable"}, {"n": "Le Carpaccio", "a": "Grand Case", "r": "French", "t": "Italian", "h": "Proper Italian, tucked just off the restaurant row.", "d": "An authentic Italian gem tucked inside the Parc Phenix commercial center just off Grand Case’s famous restaurant row. The kitchen celebrates traditional Italian gastronomy with homemade pastas, wood-fired pizzas topped with premium ingredients like prosciutto and buffalo mozzarella, and Mediterranean seafood specialties including linguine ai frutti di mare and grilled branzino. A curated Italian wine list and classic desserts—tiramisu, panna cotta, cannoli—complete the experience. Open for lunch Monday through Saturday.", "ad": "Coral Palm N°11, Parc Phenix, Route de l’Espérance, Grand Case, 97150 St. Martin", "p": "+590 690 50 54 41", "w": "instagram.com/carpaccio_sxm", "m": "https://maps.google.com/?q=Le+Carpaccio+Grand+Case+St+Martin", "o": ["casual"], "res": ""}, {"n": "L’Auberge Gourmande", "a": "Grand Case", "r": "French", "t": "Fine French", "h": "Classic fine French in a 19th-century Creole house.", "d": "Housed in a 120-year-old Creole cottage, this Grand Case institution has served fine French cuisine since 1979. Chef-Owner Alexandre and Owner Chantal deliver classics with Caribbean warmth—escargots, frog legs, French onion soup, veal chop, and beautifully baked salmon. The extensive wine list comes with sommelier guidance. A Caribbean Travel & Life ’Best of Caribbean’ award winner.", "ad": "89 Boulevard de Grand Case, Grand Case, 97150 St. Martin", "p": "+590 590 87 73 37", "w": "laubergegourmande.com", "m": "https://maps.google.com/?q=L%E2%80%99Auberge+Gourmande+Grand+Case+St+Martin", "o": ["special"], "res": ""}, {"n": "La Quintessence", "a": "Grand Case", "r": "French", "t": "Artisan Italian Pizzeria & Pasta", "h": "Artisan pizza and fresh pasta, unfussy and good.", "d": "From the team behind the popular St. Barts original, La Quintessence brings artisan sourdough pizza to the Grand Case dining scene. The chef is the only pizzaiolo on the island making his own 18-hour sourdough crust with exceptional organic Italian flour—resulting in a thin, crispy base that’s remarkably light and easy to digest. Beyond the creative pizzas (including gourmet truffle and burrata options), the menu features fresh pastas served in crispy pizza dough bowls, salads, and calzones. A cozy patio and stunning rooftop terrace with ocean views complete the experience.", "ad": "101 Boulevard de Grand Case, Grand Case, 97150 St. Martin", "p": "+590 690 66 85 00", "w": "", "m": "https://maps.google.com/?q=La+Quintessence+Grand+Case+St+Martin", "o": ["casual"], "res": ""}, {"n": "Le Pressoir", "a": "Grand Case", "r": "French", "t": "French Gastronomic", "h": "Grand Case's gastronomic landmark, in an old salt press.", "d": "The crown jewel of Caribbean fine dining, set in a century-old Creole house. Chef Jerome Droingt has earned ’Restaurant of the Year’ Caribbean 2023/2024 and topped the Caribbean Fifty Best Restaurants list four consecutive years. Signature dishes include five-hour braised octopus, smoked wahoo, and Rossini tenderloin with truffle. The 250+ wine selections and 150+ Caribbean rums at La Part des Anges bar complete the experience. Dinner only, Monday–Saturday 5pm–11pm.", "ad": "30 Boulevard de Grand Case, Grand Case, 97150 St. Martin", "p": "+590 590 87 76 62", "w": "lepressoir-sxm.com", "m": "https://maps.google.com/?q=Le+Pressoir+Grand+Case+St+Martin", "o": ["special"], "res": ""}, {"n": "MÖKA Café SXM", "a": "Grand Case", "r": "French", "t": "Brunch Café & Smoothie Bar", "h": "Brunch, smoothies and good coffee to start the day.", "d": "A charming newcomer on the Grand Case boulevard, MÖKA Café occupies the former Mood space with a fresh, airy aesthetic—think whitewashed arches, warm wood tones, and a welcoming neighborhood vibe. The casual daytime menu focuses on hearty brunch dishes and creative smoothies, making it a perfect morning stop before exploring restaurant row. Open until 5pm with kitchen service until 4pm.", "ad": "48 Boulevard de Grand Case, Grand-Case, 97150 St. Martin", "p": "+590 690 72 83 83", "w": "", "m": "https://maps.google.com/?q=M%C3%96KA+Caf%C3%A9+SXM+Grand+Case+St+Martin", "o": ["breakfast"], "res": ""}, {"n": "Quai 58", "a": "Grand Case", "r": "French", "t": "Tapas Bar & Restaurant", "h": "Tapas and wine by the water, easy and social.", "d": "Perched at the end of a jetty with water on three sides, this tapas bar from Chef Frederic Albas serves inventive small plates by day and transforms into a sunset cocktail destination. The triggerfish with porcini risotto is a signature. Owner Gaby leads a welcoming team including Agatha at the bar and Carole on service. Weekend DJs add energy after dark. Lunch 11:30am–3pm.", "ad": "End of Jetty, Grand Case, 97150 St. Martin", "p": "", "w": "", "m": "https://maps.google.com/?q=Quai+58+Grand+Case+St+Martin", "o": ["drinks", "casual"], "res": ""}, {"n": "Coco Beach", "a": "Orient Bay", "r": "French", "t": "French-Mediterranean Beach Club & Restaurant", "h": "Beach club minutes from the villa — loungers and long lunches.", "d": "Widely considered the jewel of Orient Bay, Coco Beach is a chic beachfront restaurant and beach club helmed by two-Michelin-star Chef Laurent Saudeau. The freshly renovated space blends elegant wood-and-white décor with sweeping Caribbean Sea views, offering refined French cuisine infused with Mediterranean and Caribbean flavors. Winner of the 2023 Culinary Festival ’Beach Star’ award, it’s the ultimate all-day destination—arrive for morning coffee, stay for a gourmet lunch from gazebos, beach loungers, or the dining room, and linger for handcrafted cocktails at sunset.", "ad": "Parc de la Baie Orientale, Orient Bay Beach, 97150 Saint-Martin", "p": "+590 690 64 14 94", "w": "cocobeach.restaurant", "m": "https://maps.google.com/?q=Coco+Beach+Orient+Bay+St+Martin", "o": ["walk", "beach"], "res": "OpenTable"}, {"n": "Kontiki Beach Restaurant", "a": "Orient Bay", "r": "French", "t": "French & Asian Fusion Beach Restaurant", "h": "French-Asian cooking with your feet in the sand.", "d": "The very first restaurant built on Orient Beach back in 1989, Kontiki remains one of the most iconic spots on the sand. Run by Pierrot and the Luftman Group, this chic beachfront institution serves a fusion of French cuisine and Asian specialties—from crispy red tuna and sushi rolls to roast farm chicken carved tableside and duck foie gras. Weekends bring a party atmosphere with DJ sets keeping the energy going until sunset under the signature red umbrellas.", "ad": "Baie Orientale, Orient Bay Beach, 97150 Saint-Martin", "p": "+590 690 66 24 25", "w": "kontiki.restaurant", "m": "https://maps.google.com/?q=Kontiki+Beach+Restaurant+Orient+Bay+St+Martin", "o": ["walk", "beach"], "res": ""}, {"n": "L’Atelier", "a": "Orient Bay", "r": "French", "t": "French Steakhouse & Seafood (Gault Millau recognized)", "h": "Steak and seafood on the bay, Gault Millau recognised.", "d": "L’Atelier is THE steakhouse destination on St. Martin—a ’pinnacle of steakhouse dining’ as locals call it. Owner Alexandre personally walks guests through the chalkboard menu that changes nightly. The meats are world-class: Japanese Wagyu (Kobe and Kagoshima), USDA Prime Black Angus, Portuguese Minhota Gallega, Iberico black pig, and more.", "ad": "Place du Village, Baie Orientale, 97150 Saint-Martin", "p": "+590 690 22 10 22", "w": "latelier-sxm.com", "m": "https://maps.google.com/?q=L%E2%80%99Atelier+Orient+Bay+St+Martin", "o": ["walk", "special"], "res": ""}, {"n": "Le P’tit Bistro", "a": "Orient Bay", "r": "French", "t": "Traditional French Bistro", "h": "The neighbourhood French bistro, done properly.", "d": "A St. Martin institution for over 15 years, Le P’tit Bistro is your cozy, authentic French bistro in the Caribbean. Family-run by Jerome and Manot, this charming spot serves generous, tasty traditional French cuisine with exotic weekly specials. Fresh seafood platters arrive weekly.", "ad": "Place du Village, Orient Bay, 97150 Saint-Martin", "p": "+590 690 22 00 88", "w": "leptitbistro.restaurant", "m": "https://maps.google.com/?q=Le+P%E2%80%99tit+Bistro+Orient+Bay+St+Martin", "o": ["walk", "casual"], "res": ""}, {"n": "Les Galets", "a": "Orient Bay", "r": "French", "t": "French Gastronomic Table d’Hôtes", "h": "A gastronomic table d'hôtes, a short stroll away.", "d": "An intimate host table tucked inside the lush gardens of a boutique hotel near Orient Bay. Hosts Aleksandra and Sébastien—Chef Barrière trained at Paul Bocuse, Gordon Ramsay, and Gérard Bertrand—create a new five-course prix fixe menu every week, inspired by seasonal ingredients and the fundamentals of French cuisine. The poolside setting, serenaded by tree frogs, makes for an unforgettable evening. Open Thursday through Saturday; reservations essential via WhatsApp.", "ad": "Lot 45, Les Jardins d’Orient Bay, 97150 St. Martin", "p": "+590 690 56 58 01", "w": "lesgaletssxm.com", "m": "https://maps.google.com/?q=Les+Galets+Orient+Bay+St+Martin", "o": ["walk", "special"], "res": ""}, {"n": "Maison Mère", "a": "Orient Bay", "r": "French", "t": "French with Creole Influence", "h": "French cooking with a Creole accent, close to home.", "d": "The name means “Mom’s House,” and Maison Mère delivers on that promise with refined French home-style cooking infused with Caribbean warmth. Everything from starter to dessert is made in-house with premium ingredients, and the presentation is as beautiful as the flavors. The intimate Orient Bay Village setting, exceptional cocktail program, and attentive service make every dinner feel like a special occasion.", "ad": "Place de la Baie Orientale, Orient Bay, 97150 Saint-Martin", "p": "+590 690 38 11 39", "w": "maisonmere.restaurant", "m": "https://maps.google.com/?q=Maison+M%C3%A8re+Orient+Bay+St+Martin", "o": ["walk", "casual"], "res": "OpenTable"}, {"n": "Orange Fever", "a": "Orient Bay", "r": "French", "t": "Beach Bar & Restaurant", "h": "Orient Bay beach bar — sunbeds, rum, no rush.", "d": "Orange Fever is your quintessential Orient Bay beach day destination. This casual, fun beachfront spot combines French and Caribbean dishes with killer cocktails and those famous artisanal pizzas everyone raves about. Grab a beach chair and umbrella (~$8 with a free drink included) and have lunch delivered right to you on the sand.", "ad": "Rue de la Baie Orientale, Orient Bay Beach, 97150 Saint-Martin", "p": "+590 690 75 52 11", "w": "orangefeversxm.com", "m": "https://maps.google.com/?q=Orange+Fever+Orient+Bay+St+Martin", "o": ["walk", "beach"], "res": ""}, {"n": "The Perch Bar & Grill", "a": "Orient Bay", "r": "French", "t": "Beach Bar & Grill", "h": "Grill and cocktails looking over the bay.", "d": "The only beach bar on the clothing-optional southern end of Orient Beach, located on the site of the former Club Orient resort destroyed by Hurricane Irma. Rebuilt by Randy, Shania, Cedrick and their team, The Perch serves grilled-to-order barbecue ribs, fresh mahi, garlic shrimp, cheeseburgers, and frozen cocktails at prices well below the beach clubs up north. Cash only (USD and euros accepted at 1:1).", "ad": "Club Orient, Orient Beach, 97150 St. Martin", "p": "", "w": "", "m": "https://maps.google.com/?q=The+Perch+Bar+%26+Grill+Orient+Bay+St+Martin", "o": ["walk", "beach", "drinks"], "res": ""}, {"n": "Roasty’s", "a": "Orient Bay", "r": "French", "t": "French Café & Rotisserie", "h": "Café and rotisserie — coffee in, roast chicken out.", "d": "A charming newcomer near Orient Bay Village, Roasty’s has quickly won over locals and visitors with its signature rotisserie chicken—perfectly crispy skin, tender and juicy inside with flavorful drippings. The menu extends to impressive lobster rolls, focaccia pizzas, paninis, and what regulars call the best tiramisu on the island. A welcoming spot for lunch or a casual dinner on the French side.", "ad": "261 Avenue Des Plages, Orient Bay, 97150 Saint-Martin", "p": "+590 690 38 66 70", "w": "", "m": "https://maps.google.com/?q=Roasty%E2%80%99s+Orient+Bay+St+Martin", "o": ["walk", "breakfast"], "res": ""}, {"n": "SAO Asian Factory", "a": "Orient Bay", "r": "French", "t": "Pan-Asian (Japanese, Thai, Vietnamese, Chinese)", "h": "Pan-Asian across four kitchens, minutes from the villa.", "d": "SAO delivers a refined Asian culinary escape in the heart of Orient Bay Village. Led by owner Elodie, the restaurant blends authentic flavors from across Asia with Caribbean charm. Don’t miss the house specialties like Asian-style mahi-mahi tartare and wakamé salmon. Tio at the bar is known as one of the best mixologists on the island.", "ad": "Place du Village, Baie Orientale, 97150 Saint-Martin", "p": "+590 690 73 64 36", "w": "saosxm.com", "m": "https://maps.google.com/?q=SAO+Asian+Factory+Orient+Bay+St+Martin", "o": ["walk", "casual"], "res": ""}, {"n": "BZH", "a": "Oyster Pond", "r": "French", "t": "French Crêperie & Bistro", "h": "Breton crêperie and bistro over at Oyster Pond.", "d": "A taste of Brittany in the Caribbean. Laetitia and chef Aurélien have created a cozy gourmet haven where authentic Breton galettes (savory buckwheat crêpes) and sweet crêpes shine alongside a rotating menu of hearty French classics that changes every two weeks. Everything is made in-house with love using quality fresh produce. The excellent wine list features French selections including Breton ciders. Multiple palm-shaded terraces seat 80 for relaxed dinners under the stars, with occasional live music. Open Monday–Saturday evenings.", "ad": "72 Rue de Coralita, Oyster Pond, 97150 St. Martin", "p": "+590 690 10 16 01", "w": "bzh-oysterpond.com", "m": "https://maps.google.com/?q=BZH+Oyster+Pond+St+Martin", "o": ["casual"], "res": ""}], OCC=[["walk", "Walk from the villa"], ["beach", "Beach clubs & lunch"], ["special", "Special night out"], ["casual", "Casual & local"], ["breakfast", "Breakfast & bakery"], ["drinks", "Drinks & late"], ["lively", "Lively & sport"]], AREA=["Orient Bay", "Grand Case", "Simpson Bay", "Philipsburg", "Cupecoy", "Maho Bay", "Oyster Pond"];
let mode='occ', filter=null;
const chips=document.getElementById('chips'), list=document.getElementById('list');
function groups(){ return mode==='occ' ? OCC.map(o=>[o[0],o[1]]) : AREA.map(a=>[a,a]); }
function inGroup(v,key){ return mode==='occ' ? v.o.includes(key) : v.a===key; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function card(v){
  const bits=[]; if(v.ad) bits.push(esc(v.ad)); if(v.p) bits.push(esc(v.p));
  const acts=['<a class="go" href="'+esc(v.m)+'" target="_blank" rel="noopener">Directions</a>'];
  if(v.p) acts.push('<a href="tel:'+v.p.replace(/[^+0-9]/g,'')+'">Call</a>');
  if(v.w) acts.push('<a href="https://'+esc(v.w.replace(/^https?:\/\//,''))+'" target="_blank" rel="noopener">Website</a>');
  acts.push('<span class="more">More</span>');
  return '<article><h3>'+esc(v.n)+'</h3><p class="type">'+esc(v.t)+'</p>'
   +'<p class="hook">'+esc(v.h)+'</p><p class="desc">'+esc(v.d)+'</p>'
   +(bits.length?'<p class="meta">'+bits.join(' &middot; ')+'</p>':'')
   +'<div class="actions">'+acts.join('')+'</div></article>';
}
function render(){
  chips.innerHTML = groups().map(([k,label])=>
    '<button data-k="'+esc(k)+'" aria-pressed="'+(filter===k)+'">'+esc(label)+'</button>').join('');
  const gs = filter ? groups().filter(g=>g[0]===filter) : groups();
  let html='';
  for(const [k,label] of gs){
    const vs=DATA.filter(v=>inGroup(v,k)).sort((a,b)=>a.n.localeCompare(b.n));
    if(!vs.length) continue;
    html += '<h2>'+esc(label)+'</h2>' + vs.map(card).join('');
  }
  list.innerHTML = html || '<p class="empty">Nothing here yet.</p>';
}
document.getElementById('tab-occ').onclick=()=>{mode='occ';filter=null;sync();};
document.getElementById('tab-area').onclick=()=>{mode='area';filter=null;sync();};
function sync(){
  document.getElementById('tab-occ').setAttribute('aria-pressed', mode==='occ');
  document.getElementById('tab-area').setAttribute('aria-pressed', mode==='area');
  render();
}
chips.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  filter = filter===b.dataset.k ? null : b.dataset.k; render(); });
list.addEventListener('click',e=>{ const m=e.target.closest('.more'); if(!m)return;
  const a=m.closest('article'); a.classList.toggle('open');
  m.textContent=a.classList.contains('open')?'Less':'More'; });
sync();
</script>
</body>
</html>
